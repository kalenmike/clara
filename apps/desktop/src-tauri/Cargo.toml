[package]
name = "clara-desktop"
version = "0.1.0"
description = "Clara desktop client"
authors = ["Clara"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "clara_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
