# Clara hub container.
#
#   docker network create clara            # once, or start the orchestrator stack
#   docker compose -f docker/server.compose.yml up -d --build
#
# The server joins the same private network as the orchestrator and OpenCode.
# Its panel is published on host loopback and now requires a one-time setup
# token before the superadmin password is chosen.
#
# Config and data live in named volumes by default. Set
# CLARA_SERVER_CONFIG_DIR or CLARA_SERVER_DATA_DIR to an absolute host path to
# bind them instead.

name: clara-server

services:
  server:
    container_name: clara-server
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      CLARA_CONFIG_DIR: /config
      CLARA_DATA_DIR: /data
      CLARA_LOCAL_BIND_HOST: 0.0.0.0
      CLARA_LOCAL_HOST: 127.0.0.1
      CLARA_LOCAL_PORT: '8788'
      CLARA_PANEL_BIND_HOST: 0.0.0.0
      CLARA_PANEL_ALLOW_REMOTE: '1'
      CLARA_PANEL_PORT: '8790'
      CLARA_SERVER_CONTAINER: '1'
      CLARA_ORCHESTRATION_HOST: ${CLARA_ORCHESTRATION_HOST:-orchestrator}
      CLARA_ORCHESTRATION_PORT: '8789'
      CLARA_PANEL_SECURE_COOKIE: ${CLARA_PANEL_SECURE_COOKIE:-}
      CLARA_ADMIN_SETUP_TOKEN: ${CLARA_ADMIN_SETUP_TOKEN:-}
      CLARA_ADMIN_SETUP_TOKEN_FILE: ${CLARA_ADMIN_SETUP_TOKEN_FILE:-}
      CLARA_RELAY_URL: ${CLARA_RELAY_URL:-}
      CLARA_RELAY_ROOM: ${CLARA_RELAY_ROOM:-}
      CLARA_AGENT_TOKEN: ${CLARA_AGENT_TOKEN:-}
      CLARA_CLIENT_TOKEN: ${CLARA_CLIENT_TOKEN:-}
      # Optional override. Set the Web URL in the hub panel instead.
      CLARA_PAIRING_BASE_URL: ${CLARA_PAIRING_BASE_URL:-}
      # Host port of the web client; the default panel Web URL uses it.
      CLARA_WEB_PORT: ${CLARA_WEB_PORT:-8080}
      CLARA_VAPID_PUBLIC_KEY: ${CLARA_VAPID_PUBLIC_KEY:-}
      CLARA_VAPID_PRIVATE_KEY: ${CLARA_VAPID_PRIVATE_KEY:-}
      CLARA_VAPID_SUBJECT: ${CLARA_VAPID_SUBJECT:-}
      CLARA_SECRET_KEY: ${CLARA_SECRET_KEY:-}
      CLARA_SECRET_KEY_FILE: ${CLARA_SECRET_KEY_FILE:-}
    volumes:
      - ${CLARA_SERVER_CONFIG_DIR:-clara-server-config}:/config
      - ${CLARA_SERVER_DATA_DIR:-clara-server-data}:/data
    ports:
      - '127.0.0.1:8788:8788'
      - '127.0.0.1:8790:8790'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - clara
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8790/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

volumes:
  clara-server-config:
    name: clara-server-config
  clara-server-data:
    name: clara-server-data

networks:
  clara:
    external: true
    name: clara
