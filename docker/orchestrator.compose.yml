# Clara orchestrator container.
#
#   export CLARA_ORCHESTRATION_TOKEN="$(openssl rand -hex 32)"
#   export CLARA_WORKSPACE=/absolute/path/to/your/workspace
#   docker compose -f docker/orchestrator.compose.yml up -d --build
#
# The orchestrator listens only on the private `clara` network. The host
# loopback publish exists for host tools; the OpenCode container joins the same
# network and uses http://orchestrator:8789.
#
# The database and container token live in the `clara-orchestrator-data` volume
# by default. Set CLARA_ORCHESTRATOR_DATA_DIR to an absolute host path to bind
# them instead. The workspace is always a bind mount.

name: clara

services:
  orchestrator:
    container_name: clara-orchestrator
    build:
      context: ..
      dockerfile: docker/orchestrator.Dockerfile
    restart: unless-stopped
    environment:
      CLARA_ORCHESTRATION_HOST: 0.0.0.0
      CLARA_ORCHESTRATION_PORT: '8789'
      CLARA_DATA_DIR: /data
      CLARA_ORCHESTRATION_WORKSPACE: /workspace/clara
      CLARA_STD_DIR: /opt/clara/lib/std
      CLARA_ORCHESTRATION_CONTAINER: '1'
      CLARA_ORCHESTRATION_TOKEN: ${CLARA_ORCHESTRATION_TOKEN:?"set CLARA_ORCHESTRATION_TOKEN"}
    volumes:
      - ${CLARA_ORCHESTRATOR_DATA_DIR:-clara-orchestrator-data}:/data
      - ${CLARA_WORKSPACE:?set CLARA_WORKSPACE}:/workspace/clara:ro
    networks:
      - clara
    ports:
      - '127.0.0.1:8789:8789'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8789/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 6

  # Example OpenCode service. Fill in your own image or build target.
  #
  # opencode:
  #   image: your-opencode-image
  #   restart: unless-stopped
  #   depends_on:
  #     orchestrator:
  #       condition: service_healthy
  #   environment:
  #     CLARA_ORCHESTRATION_URL: http://orchestrator:8789
  #     CLARA_ORCHESTRATION_TOKEN: ${CLARA_ORCHESTRATION_TOKEN}
  #     CLARA_ORCHESTRATION_WORKSPACE: /workspace/clara
  #   volumes:
  #     - ${CLARA_WORKSPACE}:/workspace/clara
  #     - ${HOME}/.config/opencode:/home/opencode/.config/opencode
  #   networks:
  #     - clara

volumes:
  clara-orchestrator-data:
    name: clara-orchestrator-data

networks:
  clara:
    name: clara
    driver: bridge
