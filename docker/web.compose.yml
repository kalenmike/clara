# Clara web client container.
#
#   docker network create clara            # once, or start the server stack
#   docker compose -f docker/web.compose.yml up -d --build
#
# The SPA is static; the browser connects to the home agent or relay directly.
# The container joins the clara network so a reverse proxy beside it can reach
# `web:80`. Publish it on host loopback and open http://127.0.0.1:8080.
#
# Set VITE_CLARA_WS_URL in docker/.env and rebuild for relay pairings. Leaving
# it unset keeps local pairing codes working from http://127.0.0.1:8080.

name: clara-web

services:
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        VITE_CLARA_WS_URL: ${VITE_CLARA_WS_URL:-}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${CLARA_WEB_PORT:-8080}:80'
    networks:
      - clara
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 6

networks:
  clara:
    external: true
    name: clara
