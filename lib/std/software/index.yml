id: software
name: Software development
version: 1
description: Standard software lifecycles for features, bugs, and documentation.

entry:
  router: classifier

defaults:
  task_dir: ./tasks
  enforcement: strict

router:
  id: classifier
  path: ./routers/classifier.md
  routes:
    - when: feature
      criteria: new capability or a substantial change.
      run: feature
    - when: bug
      criteria: a regression or hotfix.
      run: bug
    - when: documentation
      criteria: updates to the documentation.
      run: docs
