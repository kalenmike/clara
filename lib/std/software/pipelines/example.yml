id: example
name: Example lifecycle
description: Example pipeline with a nested task group and a router
default_model: 'deepseek-v4.1-flash'
enforcement: observed
steps:
  - name: task_1
    type: task
  - name: task_group
    type: group
    steps:
      - name: background_task
        type: task
        background: true
      - name: inline_task
        type: task
        description: Draft a technical specification document based on the incoming request
        prompt: |
          # Task: Create Specification

          Analyze the incoming feature request and generate a concise technical specification.

          Save the final spec as `spec.md` in the project root.
  - name: task_router
    type: router
    path: ./routers/example.md
