id: docs
name: Documentation lifecycle
description: Assess, update, verify, and review documentation
enforcement: strict
steps:
  - name: assess_docs
    type: task
  - name: update_docs
    type: task
    inputs:
      assessment: assess_docs
    artifacts:
      docs: docs/README.md
  - name: verify_docs
    type: task
    inputs:
      assessment: assess_docs
      update: update_docs
    artifacts:
      docs: docs/README.md
  - name: docs_review
    type: task
    inputs:
      assessment: assess_docs
      update: update_docs
      verify: verify_docs
    artifacts:
      docs: docs/README.md
