id: feature
name: Feature development
description: Standard feature development lifecycle
enforcement: strict
steps:
  - name: create_spec
    type: agent
  - name: plan_implementation
    type: agent
    inputs:
      spec: create_spec
    artifacts:
      spec: spec.md
  - name: write_tests
    type: agent
    inputs:
      spec: create_spec
      plan: plan_implementation
    artifacts:
      spec: spec.md
  - name: build_feature
    type: agent
    inputs:
      spec: create_spec
      plan: plan_implementation
      tests: write_tests
    artifacts:
      spec: spec.md
  - name: verify_implementation
    type: agent
    inputs:
      spec: create_spec
      build: build_feature
    artifacts:
      spec: spec.md
  - name: code_review
    type: agent
    inputs:
      spec: create_spec
      tests: write_tests
      build: build_feature
      verify: verify_implementation
    artifacts:
      spec: spec.md
  - name: update_docs
    type: agent
    inputs:
      spec: create_spec
      review: code_review
    artifacts:
      spec: spec.md
      docs: docs/README.md
