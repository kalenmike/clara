id: bug
name: Bug lifecycle
description: Hotfix and regression lifecycle
default_model: 'deepseek-v4.1-flash'
default_provider: 'opencode-go'
enforcement: strict
steps:
  - name: identify_bug
    type: task
  - name: write_regression_test
    type: task
  - name: fix_bug
    type: task
  - name: verify_bug_fix
    type: task
  - name: code_review
    type: task
  - name: update_docs
    type: task
