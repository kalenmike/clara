# Clara OpenCode adapter container.
#
#   docker compose -f infra/docker/adapter-opencode.compose.yml up -d --build
#
# Pair it once from the hub panel and pass the code to the install command:
#
#   docker compose -f infra/docker/adapter-opencode.compose.yml run --rm adapter \
#     install --pair <code> --opencode-url http://opencode:4096 --no-binding --no-runner --no-service
#
# Then start the container and record it on the host so `clara status` and
# `clara adapter start|stop|logs` reach it through Docker:
#
#   docker compose -f infra/docker/adapter-opencode.compose.yml up -d
#   clara adapter install opencode --container clara-adapter-opencode
#
# The adapter only makes outbound connections. It publishes no ports, and
# OpenCode stays private to the `clara` network.

name: clara-adapter-opencode

services:
  adapter:
    container_name: clara-adapter-opencode
    build:
      context: ../..
      dockerfile: infra/docker/adapter-opencode.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      CLARA_ADAPTER_CONFIG_DIR: /config
      CLARA_ADAPTER_DATA_DIR: /data
      CLARA_OPENCODE_URL: ${CLARA_OPENCODE_URL:-http://opencode:4096}
      OPENCODE_URL: ${CLARA_OPENCODE_URL:-http://opencode:4096}
      OPENCODE_PASSWORD: ${CLARA_OPENCODE_PASSWORD:-}
      CLARA_ADAPTER_WS_URL: ${CLARA_ADAPTER_WS_URL:-ws://server:8788/ws}
    volumes:
      - ${CLARA_ADAPTER_CONFIG_DIR:-clara-adapter-opencode-config}:/config
      - ${CLARA_ADAPTER_DATA_DIR:-clara-adapter-opencode-data}:/data
    networks:
      - clara

volumes:
  clara-adapter-opencode-config:
    name: clara-adapter-opencode-config
  clara-adapter-opencode-data:
    name: clara-adapter-opencode-data

networks:
  clara:
    external: true
    name: clara
