# Clara web client container.
#
#   docker network create clara            # once, or start the server stack
#   docker compose -f infra/docker/web.compose.yml up -d --build
#
# The SPA is static; the browser connects to the hub or relay directly.
# The container joins the clara network so a reverse proxy beside it can reach
# `web:80`. Publish it on host loopback and open http://127.0.0.1:8080.
#
# VITE_CLARA_WS_URL is only needed to retarget relay rooms to a relay endpoint
# different from the one in the pairing code. Local codes keep their own ws://
# URL, so leaving it unset works for both modes.

name: clara-web

services:
  web:
    container_name: clara-web
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_CLARA_WS_URL: ${VITE_CLARA_WS_URL:-}
        CLARA_COMMIT: ${CLARA_COMMIT:-}
        CLARA_DIRTY: ${CLARA_DIRTY:-0}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${CLARA_WEB_PORT:-8080}:80'
    networks:
      - clara
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 6

networks:
  clara:
    external: true
    name: clara
