# Static hosting for the built Clara web client.
#
# This mirrors apps/web/public/_headers: the service worker and app shell must
# revalidate, hashed assets may be cached for a year, and the browser gets the
# same CSP and permission policy as the Cloudflare Pages deployment.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Cookies are host-scoped, not port-scoped: unrelated apps on 127.0.0.1
    # share their cookie jar with this container. Chrome can send a Cookie
    # header larger than nginx's 8k default, which it answers with
    # "Request Header Or Cookie Too Large". Keep the static app tolerant.
    client_header_buffer_size 16k;
    large_client_header_buffers 8 32k;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http: https: ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # The web build emits this file with the version and protocol of the
    # deployed assets. Never answer it from cache.
    location = /healthz {
        access_log off;
        default_type application/json;
        expires -1;
        try_files /healthz =404;
    }

    # The app shell and the worker scripts are never answered from a long-lived
    # cache. `expires -1` emits Cache-Control: no-cache without resetting the
    # inherited security headers.
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location = /push-sw.js {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
        try_files $uri =404;
    }

    # Vite fingerprints every asset in this directory.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
