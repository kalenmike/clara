name: hub-headless

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            target: bun-darwin-arm64
          - name: macos-x64
            os: macos-15-intel
            target: bun-darwin-x64
          - name: linux-x64
            os: ubuntu-22.04
            target: bun-linux-x64
          - name: windows-x64
            os: windows-latest
            target: bun-windows-x64

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: pnpm install --frozen-lockfile

      - name: Build headless archive
        run: pnpm --filter @clara/hub-server headless --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v6
        with:
          name: clara-hub-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/headless/**
