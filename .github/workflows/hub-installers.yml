name: hub-installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-13
            target: x86_64-apple-darwin
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf

      - run: pnpm install --frozen-lockfile

      - name: Build tray installer
        run: pnpm hub:build
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
          CARGO_BUILD_TARGET: ${{ matrix.target }}

      - name: Build headless archive
        run: pnpm --filter @clara/hub-desktop headless --target ${{ matrix.target }}
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
          CARGO_BUILD_TARGET: ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: clara-hub-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/hub/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**
            apps/hub/desktop/src-tauri/target/release/bundle/**
            dist/headless/**
