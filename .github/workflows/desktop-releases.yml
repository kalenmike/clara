name: desktop-releases

# Build the Clara desktop installers on every supported platform and publish
# them to a `desktop-v*` GitHub release. Each runner builds its own native
# installers; Tauri does not cross-compile the bundles here. Installers are
# unsigned, so the operating system may warn on the first launch.
#
# Use the workflow_dispatch form for a manual release. A `desktop-v*` tag is
# the reproducible path: the tag supplies the version and the release name.
# `dry_run` builds and collects the artifacts without touching a release.

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without a leading v (required for a manual release)'
        required: false
        type: string
      dry_run:
        description: 'Build and collect the installers without touching a GitHub release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: desktop-releases-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve the release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          version="${INPUT_VERSION:-}"
          version="${version#v}"
          if [ -z "$version" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            case "$GITHUB_REF_NAME" in
              desktop-v*) version="${GITHUB_REF_NAME#desktop-v}" ;;
              *) echo "Tag $GITHUB_REF_NAME is not a desktop-v* tag." >&2; exit 1 ;;
            esac
          fi
          if [ -z "$version" ]; then
            echo "Provide a version input for a manual desktop release." >&2
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: use a semver such as 0.2.0 or 0.2.0-rc.1." >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=desktop-v$version"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf

      - run: pnpm install --frozen-lockfile

      - name: Build installers
        env:
          CLARA_DIRTY: '0'
        run: >-
          node apps/desktop/scripts/build-release.mjs
          --version "${{ needs.prepare.outputs.version }}"
          --target "${{ matrix.target }}"
          --bundles "${{ matrix.bundles }}"
          --commit "${{ github.sha }}"

      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: dist/desktop-release/**

  publish:
    name: publish
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: dist/downloads

      - name: Collect installers and checksums
        run: |
          set -eu
          mkdir -p dist/release
          find dist/downloads -type f ! -name SHA256SUMS -exec cp -t dist/release {} +
          (
            cd dist/release
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
              | sort | xargs sha256sum > SHA256SUMS
            cat SHA256SUMS
          )

      - name: Create draft release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
            exit 0
          fi
          {
            echo "Clara Desktop $VERSION installers for macOS (arm64 and x64), Linux, and Windows."
            echo ""
            echo "- macOS: DMG disk image with the app bundle"
            echo "- Linux: Debian package, RPM package, and AppImage"
            echo "- Windows: MSI and NSIS installers"
            echo ""
            echo "Installers are unsigned, so the operating system may warn on the first launch."
            echo "Verify each download with \`SHA256SUMS\`."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" \
            --draft \
            --title "Clara Desktop $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Upload installers
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -eu
          gh release upload "$TAG" dist/release/* --clobber

      - name: Publish release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -eu
          gh release edit "$TAG" --draft=false --latest=false

      - name: Summary
        if: always()
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Desktop release $VERSION"
            echo ""
            echo "- Tag: \`$TAG\`"
            if [ "$DRY_RUN" = "true" ]; then
              echo "- Dry run: no release assets were uploaded."
            else
              echo "- Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
            fi
            echo ""
            echo '```'
            ls -lh dist/release 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
