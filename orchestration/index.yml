is_active: true

# Workspace defaults. Imported packages that do not declare their own model
# and provider inherit these values. Uncomment and set the provider and model
# your OpenCode install has access to.
defaults:
  provider: 'opencode-go'
  model: 'deepseek-v4.1-flash'

# Override a standard package without editing lib/std. Only the keys you set
# are replaced; everything else still comes from the package.
# overrides:
#   std:software:
#     defaults:
#       provider: 'opencode-go'
#       model: 'deepseek-v4.1-flash'
#     pipelines:
#       feature:
#         default_model: 'deepseek-v4.1-flash'
#     tasks:
#       code_review:
#         model: 'deepseek-v4.1-flash'

imports:
  std:
    - path: software
    - path: content
    - path: research
    - path: diagnostics
    - path: maintenance

watchdog:
  enabled: true
  check_interval_seconds: 10
  stalled_threshold_seconds: 30
  max_reconciliation_attempts: 3
  on_exhausted: escalate
  escalation_pipeline: std:software/bug

router:
  id: classifier
  path: ./routers/classifier.md
  routes:
    - when: rebuild
      criteria: an explicit request to rebuild Clara itself, reinstall its adapters, restart all local Clara services, or verify their health.
      run: std:maintenance
    - when: content
      criteria: a request to write, draft, edit, or deliver an article, post, essay, or other prose content.
      run: std:content
    - when: software-development
      criteria: a normal software feature, bug, or documentation request.
      run: std:software
    - when: quick-patch
      criteria: a small, local lifecycle patch with no full spec cycle.
      run: quick_patch
    - when: research
      criteria: a request for external research, industry or market analysis, source gathering, or a cited research brief.
      run: std:research
    - when: diagnostics
      criteria: a request to audit, diagnose, or self-analyze the orchestrator itself, including its database, run history, failures, alerts, retries, or pipeline setup.
      run: std:diagnostics

pipelines:
  quick_patch:
    name: Quick patch
    description: 'A fast local lifecycle patch'
    steps:
      - name: patch_code
        type: task
      - name: quick_verify
        type: task
        inputs:
          patch: patch_code
