id: diagnose
name: Orchestrator self-diagnosis
description: Collect deterministic evidence, find failure patterns, audit setup, rank issues, and return fixes.
enforcement: observed
steps:
  - name: collect_evidence
    type: script
    command: clara-engine analyze --json --days 30
    result_mode: json
    timeout_seconds: 300
  - name: pattern_failures
    type: agent
    inputs:
      evidence: collect_evidence
  - name: audit_setup
    type: agent
    inputs:
      evidence: collect_evidence
  - name: rank_issues
    type: agent
    inputs:
      patterns: pattern_failures
      audit: audit_setup
  - name: propose_fixes
    type: agent
    inputs:
      ranked: rank_issues
      patterns: pattern_failures
  - name: review_report
    type: agent
    inputs:
      fixes: propose_fixes
      ranked: rank_issues
