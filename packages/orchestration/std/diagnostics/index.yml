id: diagnostics
name: Orchestrator diagnostics
version: 1
description: Audit orchestrator history, failures, alerts, and setup; report ranked issues with proposed fixes.

entry:
  pipeline: diagnose

defaults:
  agent_dir: ./agents
  # Diagnostics must run when the setup is already broken, including when the
  # strict adapter is missing or stale. Evidence collection is a script; the
  # interpretation agents stay read-only by prompt.
  enforcement: observed
